<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard – ZA Incident Tracker</title>
  
  <!-- Leaflet + MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <link rel="stylesheet" href="css/style.css"> <!-- if you have shared styles -->

  <style>
    body { font-family: Arial, sans-serif; margin:0; padding:20px; background:#f4f6f9; }
    h1 { text-align:center; color:#1a3c6d; margin-bottom:10px; }
    #map { height:400px; margin:20px auto; max-width:1400px; border:1px solid #ccc; border-radius:8px; }
    table { width:100%; max-width:1400px; margin:20px auto; border-collapse:collapse; background:white; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
    th, td { padding:12px; border:1px solid #ddd; text-align:left; }
    th { background:#e3f2fd; }
    tr.pending { background:#fff3cd !important; font-weight:bold; }
    .approve-btn { background:#28a745; color:white; margin-right:8px; }
    .reject-btn  { background:#dc3545; color:white; }
    #pending-count { font-size:1.4em; font-weight:bold; color:#d32f2f; text-align:center; margin:15px 0; }
    #logout { float:right; background:#d32f2f; color:white; padding:10px 20px; border:none; border-radius:6px; cursor:pointer; }
  </style>
</head>
<body>

  <button id="logout">Logout</button>
  <h1>🔐 Admin Dashboard – ZA Incident Tracker</h1>
  <div id="pending-count">Pending reports: 0</div>

  <div id="map"></div>

  <table>
    <thead>
      <tr>
        <th>Time</th>
        <th>Type</th>
        <th>Area</th>
        <th>Reporter</th>
        <th>Description</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="alert-table-body"></tbody>
  </table>

  <script src="js/map.js"></script>
  <script src="js/admin.js"></script>

</body>
</html>
